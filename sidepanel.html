<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dr. De SouzAI Architect</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, system-ui, sans-serif; padding: 14px; background: #f8f9fa; color: #212529; font-size: 13px; }
    h2 { font-size: 1em; font-weight: 900; color: #2c3e50; margin-bottom: 10px; }
    select, textarea, input, button { width: 100%; margin-bottom: 10px; padding: 9px; border-radius: 6px; border: 1px solid #ced4da; font-size: 0.9em; }
    textarea { height: 90px; resize: vertical; }
    button { background: #000; color: #fff; font-weight: bold; border: none; cursor: pointer; }
    button:hover { background: #222; }
    label { font-size: 0.75em; color: #6c757d; display: block; margin-bottom: 3px; }
    #prog-cont { display: none; background: #e9ecef; border-radius: 4px; height: 6px; margin-bottom: 10px; }
    #prog-bar { height: 6px; background: #e74c3c; border-radius: 4px; width: 0%; transition: width 0.1s; }
    #result-area { background: #fff; padding: 14px; border-radius: 8px; border: 1px solid #e9ecef; min-height: 80px; margin-top: 6px; }
    #result-area img { width: 100%; border-radius: 6px; margin-top: 8px; border: 1px solid #dee2e6; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
    td, th { border: 1px solid #dee2e6; padding: 5px 8px; text-align: left; }
    th { background: #f1f3f5; }
    .hf-section { background: #fff8e1; border: 1px solid #ffe082; border-radius: 6px; padding: 10px; margin-bottom: 10px; }
    .hf-section label { color: #795548; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Dr. De SouzAI Architect v2.0</h2>
  <select id="skill-selector">
    <option value="hook">Viral Hook Generation</option>
    <option value="thumbnail">AI Thumbnail Generator</option>
    <option value="summary">Executive Summary</option>
    <option value="hype">Hype Engine</option>
    <option value="table">Structured Table</option>
    <option value="translate">Translate</option>
  </select>
  <textarea id="user-input" placeholder="Paste your video title or concept here..."></textarea>
  <div class="hf-section" id="hf-section" style="display:none;">
    <label for="hf-token">Hugging Face Free Token (required for thumbnail):</label>
    <input type="password" id="hf-token" placeholder="hf_xxxxxxxxxxxxxxxxxxxxxxxx" />
    <label style="color:#9e9e9e;font-weight:normal;">Get yours free at huggingface.co - Settings - Access Tokens</label>
  </div>
  <div id="prog-cont"><div id="prog-bar"></div></div>
  <button id="run-skill">Execute Protocol</button>
  <div id="result-area">
    <span id="result-text" style="color:#6c757d;">System ready. Awaiting input.</span>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
